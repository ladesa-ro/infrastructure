---
- name: Conferir que a deploy key existe
  ansible.builtin.stat:
    path: "{{ self_pull_timer_deploy_key }}"
  register: self_pull_timer_deploy_key_stat

- name: Conferir que a senha do vault existe
  ansible.builtin.stat:
    path: "{{ self_pull_timer_vault_pass_file }}"
  register: self_pull_timer_vault_pass_stat

- name: Conferir que a deploy key do infrastructure-vault existe
  ansible.builtin.stat:
    path: "{{ self_pull_timer_vault_repo_deploy_key }}"
  register: self_pull_timer_vault_repo_deploy_key_stat

- name: Falhar cedo se algum pré-requisito estiver faltando
  ansible.builtin.assert:
    that:
      - self_pull_timer_deploy_key_stat.stat.exists
      - self_pull_timer_vault_pass_stat.stat.exists
      - self_pull_timer_vault_repo_deploy_key_stat.stat.exists
    fail_msg: >-
      faltam pré-requisitos pro timer do ansible-pull: deploy key do
      infrastructure em {{ self_pull_timer_deploy_key }}
      ({{ self_pull_timer_deploy_key_stat.stat.exists }}), senha do vault em
      {{ self_pull_timer_vault_pass_file }}
      ({{ self_pull_timer_vault_pass_stat.stat.exists }}), e deploy key do
      infrastructure-vault em {{ self_pull_timer_vault_repo_deploy_key }}
      ({{ self_pull_timer_vault_repo_deploy_key_stat.stat.exists }}).

- name: Instalar o unit do ansible-pull
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/systemd/ansible-pull.service"
    dest: /etc/systemd/system/ansible-pull.service
    owner: root
    group: root
    mode: "0644"
  register: self_pull_timer_service_instalado

- name: Instalar o timer do ansible-pull
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/systemd/ansible-pull.timer"
    dest: /etc/systemd/system/ansible-pull.timer
    owner: root
    group: root
    mode: "0644"
  register: self_pull_timer_instalado

- name: Recarregar o systemd se algum unit mudou
  ansible.builtin.systemd:
    daemon_reload: true
  when: self_pull_timer_service_instalado.changed or self_pull_timer_instalado.changed

- name: Habilitar e iniciar o timer
  ansible.builtin.systemd:
    name: ansible-pull.timer
    enabled: true
    state: started
  ignore_errors: "{{ ansible_check_mode }}"
