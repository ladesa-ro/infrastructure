---
- name: Instalar o firewalld
  ansible.builtin.package:
    name: firewalld
    state: present

- name: Garantir que o firewalld está habilitado no boot
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
  register: firewalld_habilitacao
  ignore_errors: "{{ ansible_check_mode }}"

- name: Garantir que o firewalld está ativo
  ansible.builtin.systemd:
    name: firewalld
    state: started
  register: firewalld_ativacao
  ignore_errors: "{{ ansible_check_mode }}"

- name: Conferir se o firewalld está de fato ativo
  ansible.builtin.command:
    cmd: firewall-cmd --state
  register: firewalld_estado
  changed_when: false
  failed_when: false
  check_mode: false
  retries: 15
  delay: 2
  until: (firewalld_estado.rc | default(-1)) == 0

- name: Conferir se a configuração das zonas e regras pode rodar
  ansible.builtin.include_role:
    name: gate_check_mode_prereq
  vars:
    gate_check_mode_prereq_fact_name: firewalld_configurar_gate
    gate_check_mode_prereq_ok: "{{ (firewalld_estado.rc | default(-1)) == 0 }}"
    gate_check_mode_prereq_message: >-
      Modo --check numa primeira execução: o firewalld ainda não está
      ativo de verdade, porque só seria instalado e iniciado numa execução
      real. Nada neste role pode ser conferido ainda.

- name: Configurar as zonas e regras do firewalld
  when: firewalld_configurar_gate
  block:
    - name: Garantir que a porta do SSH está na lista de portas públicas
      ansible.builtin.assert:
        that: (firewalld_porta_ssh ~ '/tcp') in firewalld_portas_publicas
        fail_msg: >-
          firewalld_portas_publicas não inclui {{ firewalld_porta_ssh }}/tcp.
          Este role remove os serviços padrão de fábrica da zona pública
          (incluindo `ssh`), então sem essa porta explícita o reload
          deixaria o SSH bloqueado.

    - name: Garantir que cada porta pública declarada está no formato número/protocolo
      ansible.builtin.assert:
        that: item is match('^[0-9]+/(tcp|udp)$')
        fail_msg: >-
          "{{ item }}" em firewalld_portas_publicas não está no formato
          esperado (ex.: "22/tcp"). Uma entrada malformada faz o
          firewall-cmd falhar de um jeito que este role confundiria com
          "porta ainda não liberada", em vez de um erro de configuração.
      loop: "{{ firewalld_portas_publicas }}"

    - name: Garantir que cada rede interna do k3s declarada é uma faixa CIDR válida
      ansible.builtin.assert:
        that: item is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$')
        fail_msg: >-
          "{{ item }}" em firewalld_redes_k3s não parece uma faixa CIDR
          válida (ex.: "10.42.0.0/16").
      loop: "{{ firewalld_redes_k3s }}"

    - name: Conferir a zona padrão atual
      ansible.builtin.command:
        cmd: firewall-cmd --get-default-zone
      register: firewalld_zona_atual
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Zona padrão pública, negar por padrão
      ansible.builtin.command:
        cmd: firewall-cmd --set-default-zone=public
      when: >-
        (firewalld_zona_atual.stdout_lines[-1] if firewalld_zona_atual.stdout_lines else '') != 'public'
      changed_when: true
      register: firewalld_zona_mudou

    - name: Conferir quais serviços a zona pública libera por padrão de fábrica
      ansible.builtin.command:
        cmd: firewall-cmd --zone=public --list-services
      register: firewalld_servicos_padrao
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Remover os serviços que a zona pública libera por padrão de fábrica
      ansible.builtin.command:
        cmd: "firewall-cmd --zone=public --remove-service={{ item }} --permanent"
      loop: "{{ firewalld_servicos_padrao.stdout.split() }}"
      changed_when: true
      register: firewalld_servicos_removidos

    - name: Conferir quais portas públicas já estão abertas
      ansible.builtin.command:
        cmd: "firewall-cmd --zone=public --query-port={{ item }}"
      loop: "{{ firewalld_portas_publicas }}"
      register: firewalld_portas_atuais
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Abrir as portas públicas que ainda não estão liberadas
      ansible.builtin.command:
        cmd: "firewall-cmd --zone=public --add-port={{ item.item }} --permanent"
      loop: "{{ firewalld_portas_atuais.results }}"
      when: item.rc != 0
      changed_when: true
      register: firewalld_portas_abertas

    - name: Conferir se a porta pública liberada pra qualquer origem (80/443) ainda existe
      ansible.builtin.command:
        cmd: "firewall-cmd --zone=public --query-port={{ item }}"
      loop: "{{ firewalld_portas_cloudflare }}"
      register: firewalld_portas_amplas_atuais
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Remover 80/443 liberados pra qualquer origem, substituídos pelas rich rules do Cloudflare abaixo
      ansible.builtin.command:
        cmd: "firewall-cmd --zone=public --remove-port={{ item.item }} --permanent"
      loop: "{{ firewalld_portas_amplas_atuais.results }}"
      when: item.rc == 0
      changed_when: true
      register: firewalld_portas_amplas_removidas

    - name: Conferir se o ipset do Cloudflare IPv4 já existe
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --get-ipsets
      register: firewalld_ipsets_existentes
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Criar o ipset do Cloudflare IPv4
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --new-ipset=cloudflare4 --type=hash:net --family=inet
      when: "'cloudflare4' not in firewalld_ipsets_existentes.stdout.split()"
      changed_when: true
      register: firewalld_ipset4_criado

    - name: Criar o ipset do Cloudflare IPv6
      ansible.builtin.command:
        cmd: firewall-cmd --permanent --new-ipset=cloudflare6 --type=hash:net --family=inet6
      when: "'cloudflare6' not in firewalld_ipsets_existentes.stdout.split()"
      changed_when: true
      register: firewalld_ipset6_criado

    - name: Conferir quais faixas IPv4 do Cloudflare já estão no ipset
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --ipset=cloudflare4 --query-entry={{ item }}"
      loop: "{{ firewalld_cloudflare_ipv4 }}"
      register: firewalld_ipv4_atuais
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Adicionar as faixas IPv4 do Cloudflare que ainda faltam no ipset
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --ipset=cloudflare4 --add-entry={{ item.item }}"
      loop: "{{ firewalld_ipv4_atuais.results }}"
      when: item.rc != 0
      changed_when: true
      register: firewalld_ipv4_adicionadas

    - name: Conferir quais faixas IPv6 do Cloudflare já estão no ipset
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --ipset=cloudflare6 --query-entry={{ item }}"
      loop: "{{ firewalld_cloudflare_ipv6 }}"
      register: firewalld_ipv6_atuais
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Adicionar as faixas IPv6 do Cloudflare que ainda faltam no ipset
      ansible.builtin.command:
        cmd: "firewall-cmd --permanent --ipset=cloudflare6 --add-entry={{ item.item }}"
      loop: "{{ firewalld_ipv6_atuais.results }}"
      when: item.rc != 0
      changed_when: true
      register: firewalld_ipv6_adicionadas

    - name: Conferir se as rich rules do Cloudflare (IPv4) já existem
      ansible.builtin.command:
        cmd: >-
          firewall-cmd --permanent --zone=public --query-rich-rule=
          rule family="ipv4" source ipset="cloudflare4" port port="{{ item | regex_replace('/tcp$', '') }}" protocol="tcp" accept
      loop: "{{ firewalld_portas_cloudflare }}"
      register: firewalld_rich_v4_atuais
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Adicionar as rich rules do Cloudflare (IPv4) que ainda faltam
      ansible.builtin.command:
        cmd: >-
          firewall-cmd --permanent --zone=public --add-rich-rule=
          rule family="ipv4" source ipset="cloudflare4" port port="{{ item.item | regex_replace('/tcp$', '') }}" protocol="tcp" accept
      loop: "{{ firewalld_rich_v4_atuais.results }}"
      when: item.rc != 0
      changed_when: true
      register: firewalld_rich_v4_adicionadas

    - name: Conferir se as rich rules do Cloudflare (IPv6) já existem
      ansible.builtin.command:
        cmd: >-
          firewall-cmd --permanent --zone=public --query-rich-rule=
          rule family="ipv6" source ipset="cloudflare6" port port="{{ item | regex_replace('/tcp$', '') }}" protocol="tcp" accept
      loop: "{{ firewalld_portas_cloudflare }}"
      register: firewalld_rich_v6_atuais
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Adicionar as rich rules do Cloudflare (IPv6) que ainda faltam
      ansible.builtin.command:
        cmd: >-
          firewall-cmd --permanent --zone=public --add-rich-rule=
          rule family="ipv6" source ipset="cloudflare6" port port="{{ item.item | regex_replace('/tcp$', '') }}" protocol="tcp" accept
      loop: "{{ firewalld_rich_v6_atuais.results }}"
      when: item.rc != 0
      changed_when: true
      register: firewalld_rich_v6_adicionadas

    - name: Conferir se a interface de administração já está na zona certa
      ansible.builtin.command:
        cmd: "firewall-cmd --zone={{ firewalld_zona_admin }} --query-interface={{ firewalld_interface_admin }}"
      register: firewalld_interface_atual
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Colocar a interface da malha ZeroTier na zona de administração
      ansible.builtin.command:
        cmd: >-
          firewall-cmd --zone={{ firewalld_zona_admin }}
          --add-interface={{ firewalld_interface_admin }} --permanent
      when: firewalld_interface_atual.rc != 0
      changed_when: true
      register: firewalld_interface_mudou

    - name: Conferir quais redes internas do k3s já estão na zona confiável
      ansible.builtin.command:
        cmd: "firewall-cmd --zone={{ firewalld_zona_k3s }} --query-source={{ item }}"
      loop: "{{ firewalld_redes_k3s }}"
      register: firewalld_redes_atuais
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Colocar as redes internas do k3s que ainda faltam na zona confiável
      ansible.builtin.command:
        cmd: "firewall-cmd --zone={{ firewalld_zona_k3s }} --add-source={{ item.item }} --permanent"
      loop: "{{ firewalld_redes_atuais.results }}"
      when: item.rc != 0
      changed_when: true
      register: firewalld_redes_mudaram

    - name: Decidir se alguma configuração de firewall realmente mudou
      ansible.builtin.set_fact:
        firewalld_teve_mudanca_real: >-
          {{ firewalld_ativacao is changed
             or (firewalld_zona_mudou | default({})) is changed
             or (firewalld_servicos_removidos | default({})).results
                | default([]) | selectattr('changed') | list | length > 0
             or (firewalld_portas_abertas | default({})).results
                | default([]) | selectattr('changed') | list | length > 0
             or (firewalld_portas_amplas_removidas | default({})).results
                | default([]) | selectattr('changed') | list | length > 0
             or (firewalld_ipset4_criado | default({})) is changed
             or (firewalld_ipset6_criado | default({})) is changed
             or (firewalld_ipv4_adicionadas | default({})).results
                | default([]) | selectattr('changed') | list | length > 0
             or (firewalld_ipv6_adicionadas | default({})).results
                | default([]) | selectattr('changed') | list | length > 0
             or (firewalld_rich_v4_adicionadas | default({})).results
                | default([]) | selectattr('changed') | list | length > 0
             or (firewalld_rich_v6_adicionadas | default({})).results
                | default([]) | selectattr('changed') | list | length > 0
             or (firewalld_interface_mudou | default({})) is changed
             or (firewalld_redes_mudaram | default({})).results
                | default([]) | selectattr('changed') | list | length > 0 }}

    - name: Recarregar o firewalld pra aplicar as regras permanentes
      ansible.builtin.command:
        cmd: firewall-cmd --reload
      when: firewalld_teve_mudanca_real
      changed_when: true
      notify: Reiniciar o k3s

    - name: Aplicar o reinício do k3s agora, se o firewalld recarregou
      ansible.builtin.meta: flush_handlers
