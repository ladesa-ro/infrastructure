site_name: infrastructure
site_description: Bootstrap declarativo e setup GitOps de um cluster k3s de node único
site_url: https://ladesa-ro.github.io/infrastructure/
repo_url: https://github.com/ladesa-ro/infrastructure
repo_name: ladesa-ro/infrastructure
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Tema claro
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - tables
  - admonition
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Aprender:
      - Visão geral: aprender/index.md
      - Git: aprender/git.md
      - SSH: aprender/ssh.md
      - Ansible: aprender/ansible.md
      - k3s: aprender/k3s.md
      - firewalld: aprender/firewalld.md
      - Argo CD: aprender/argocd.md
      - Infisical: aprender/infisical.md
      - CI, CD e CD: aprender/ci-cd.md
      - Promoção entre ambientes: aprender/promocao-entre-ambientes.md
      - Operators: aprender/kubernetes-operators.md
      - Rede interna do cluster: aprender/rede-interna-do-cluster.md
