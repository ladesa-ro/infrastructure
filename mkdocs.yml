      - Papéis: aprender/papeis.md
      - Também relevante:
          - Entrega e plataforma:
              - IaC e provisionamento: aprender/iac-provisionamento.md
              - Policy as code: aprender/policy-as-code.md
              - Internal Developer Platform: aprender/idp.md
              - API gateway: aprender/api-gateway.md
              - Mensageria e streaming: aprender/mensageria.md
              - Artifact management: aprender/artifact-management.md
              - Container registry: aprender/container-registry.md
          - Confiabilidade:
