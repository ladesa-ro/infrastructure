---
name: commit-lint

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validar mensagens de commit (Conventional Commits, sem corpo, sem Co-Authored-By)
        continue-on-error: true
        run: bash scripts/lint-commit-messages.sh "${{ github.event.before }}" "${{ github.sha }}"
