---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/.github/workflows"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: "/tools/quality"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
