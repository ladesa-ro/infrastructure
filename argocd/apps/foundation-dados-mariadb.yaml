---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundation-dados-mariadb
  namespace: argocd
  annotations:
    # Depois do operador (foundation-mariadb-operator, sync-wave "1").
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ladesa
  source:
    repoURL: https://github.com/ladesa-ro/infrastructure.git
    targetRevision: main
    path: argocd/foundation/dados-mariadb
  destination:
    server: https://kubernetes.default.svc
    namespace: dados
  syncPolicy:
    # MariaDB CR protegido com Prune=false (ver mariadb.yaml), mesmo motivo
    # do Postgres: storageClass local-path tem ReclaimPolicy Delete.
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
