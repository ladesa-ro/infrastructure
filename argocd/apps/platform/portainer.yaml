---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundation-portainer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ladesa
  source:
    repoURL: https://portainer.github.io/k8s/
    chart: portainer
    targetRevision: 1.0.59
    helm:
      releaseName: portainer
      values: |
        image:
          repository: portainer/portainer-ee
          tag: 2.21.5
        service:
          type: ClusterIP
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: ladesa-ro-issuer-production
          hosts:
            - host: portainer.ladesa.com.br
              paths:
                - path: /
          tls:
            - hosts:
                - portainer.ladesa.com.br
              secretName: portainer-tls
  destination:
    server: https://kubernetes.default.svc
    namespace: portainer
  revisionHistoryLimit: 3
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
