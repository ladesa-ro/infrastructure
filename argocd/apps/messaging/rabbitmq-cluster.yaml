---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundation-ladesa-ro-production-rabbitmq-cluster
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: ladesa
  source:
    repoURL: https://github.com/ladesa-ro/infrastructure.git
    targetRevision: main
    path: argocd/foundation/messaging/rabbitmq-cluster
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ladesa-ro-production
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
