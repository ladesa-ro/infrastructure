---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundation-redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ladesa
  source:
    repoURL: https://github.com/ladesa-ro/infrastructure.git
    targetRevision: main
    path: argocd/foundation/redis
  destination:
    server: https://kubernetes.default.svc
    namespace: redis-server
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
