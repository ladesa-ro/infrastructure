---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundation-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: ladesa
  source:
    repoURL: https://github.com/ladesa-ro/infrastructure.git
    targetRevision: main
    path: argocd/foundation/cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  revisionHistoryLimit: 3
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
