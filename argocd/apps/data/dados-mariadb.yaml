---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundation-dados-mariadb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ladesa
  sources:
    - repoURL: https://helm.mariadb.com/mariadb-operator
      chart: mariadb-cluster
      targetRevision: 26.6.0
      helm:
        valueFiles:
          - $values/argocd/foundation/data/dados-mariadb/values.yaml
    - repoURL: https://github.com/ladesa-ro/infrastructure.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ladesa-ro/infrastructure.git
      targetRevision: main
      path: argocd/foundation/data/dados-mariadb
  destination:
    server: https://kubernetes.default.svc
    namespace: dados
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
