---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ladesa
  namespace: argocd
spec:
  description: Foundation do cluster ladesa, trazido de infrastructure.git, com escopo de recursos cluster-wide (CRDs, RBAC, webhooks)
  sourceRepos:
    - https://github.com/ladesa-ro/infrastructure.git
    - https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    - https://portainer.github.io/k8s/
    - https://helm.mariadb.com/mariadb-operator
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "*"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Pod
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: batch
      kind: Job
    - group: batch
      kind: CronJob
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: policy
      kind: PodDisruptionBudget
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: networking.k8s.io
      kind: Ingress
    - group: cert-manager.io
      kind: Certificate
    - group: cert-manager.io
      kind: Issuer
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: secrets.infisical.com
      kind: InfisicalSecret
    - group: secrets.infisical.com
      kind: InfisicalPushSecret
    - group: postgresql.cnpg.io
      kind: Cluster
    - group: postgresql.cnpg.io
      kind: Database
    - group: k8s.mariadb.com
      kind: MariaDB
