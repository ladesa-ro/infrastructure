---
# CR do mariadb-operator. Sem import de dado (diferente do Postgres/CNPG):
# investigado ao vivo antes de escrever este arquivo, o MariaDB antigo só
# tinha os databases de sistema (mysql, information_schema, performance_schema,
# sys) e usuários padrão da imagem, nenhum database de aplicação, nenhum
# consumidor real encontrado no cluster. Adoção direta, sem bootstrapFrom.
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
  namespace: dados
  annotations:
    # Mesmo motivo do postgres-cluster.yaml: prune automático é seguro
    # pros outros recursos desta Application, mas não pra este, que carrega
    # o volume de dado real.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  image: docker.io/mariadb:12@sha256:a02fe89cb597d4375812b2eac90cf9d0775d4686daa7f7cc750ebbcad7525bbc
  rootPasswordSecretKeyRef:
    name: mariadb-env
    key: MARIADB_ROOT_PASSWORD
  replicas: 1
  port: 3306
  storage:
    size: 1Gi
    storageClassName: local-path
---
# Reaproveita o nome exato "db-mariadb": labels reais conferidas ao vivo no
# pod primário (app.kubernetes.io/instance=mariadb, k8s.mariadb.com/role=
# primary) depois do CR subir, não adivinhadas. Sem isso, esta Service
# fica órfã: existe no cluster (corrigida manualmente no cutover), mas sem
# lastro nenhum no git, arriscando desaparecer numa sincronização futura
# com prune de outra Application.
apiVersion: v1
kind: Service
metadata:
  name: db-mariadb
  namespace: dados
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: mariadb
    k8s.mariadb.com/role: primary
  ports:
    - port: 3306
      targetPort: 3306
