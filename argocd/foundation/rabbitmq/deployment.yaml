---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: ladesa-ro-production
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: docker.io/bitnamilegacy/rabbitmq:3.12@sha256:8d6e76bd0d38c2578d1088d9c7067e0da4a76835dd750fa81c0e966ac75a6005
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: ladesa-ro-rabbitmq-config
          ports:
            - containerPort: 15672
              name: web
            - containerPort: 5672
              name: amqp
          startupProbe:
            httpGet:
              path: /
              port: 15672
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: 15672
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 15672
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: rabbitmq-mnesia-vol
              mountPath: /bitnami/rabbitmq/mnesia
      volumes:
        - name: rabbitmq-mnesia-vol
          persistentVolumeClaim:
            claimName: rabbitmq-mnesia-pvc
