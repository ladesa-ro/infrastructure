apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-amqp
  namespace: ladesa-ro-production
  labels:
    app: rabbitmq
spec:
  type: LoadBalancer
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
  selector:
    app: rabbitmq
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-web
  namespace: ladesa-ro-production
  labels:
    app: rabbitmq
spec:
  type: NodePort
  ports:
    - name: web
      port: 80
      targetPort: web
  selector:
    app: rabbitmq
