---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: foundation-dados-mariadb
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: ladesa
  source:
    repoURL: https://github.com/ladesa-ro/infrastructure.git
    targetRevision: main
    path: argocd/apps/data/dados-mariadb
    helm:
      releaseName: foundation-dados-mariadb
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dados
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
